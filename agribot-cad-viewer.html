<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriBot — CAD Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14171a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e8e6de;
    overflow: hidden;
  }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    z-index: 10;
    pointer-events: none;
  }
  .title { font-size: 14px; letter-spacing: 0.02em; color: #8f9499; pointer-events: none; }
  .title strong { color: #e8e6de; font-weight: 500; }

  .tabs {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 5px;
    z-index: 10;
  }
  .tab {
    appearance: none; border: none; cursor: pointer;
    padding: 9px 18px;
    border-radius: 7px;
    background: transparent;
    color: #a8adb2;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab:hover { color: #e8e6de; }
  .tab.active { background: #c9784f; color: #1a1512; }

  .hint {
    position: absolute; top: 20px; right: 28px;
    font-size: 12px; color: #6b7075;
    z-index: 10;
    pointer-events: none;
  }

  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #8f9499;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .loading.hidden { opacity: 0; }

  .err {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 13px; color: #d98a6f; max-width: 320px; text-align: center;
    display: none;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div class="topbar">
  <div class="title">AgriBot &nbsp;/&nbsp; <strong id="modelLabel">Complete assembly</strong></div>
</div>

<div class="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>

<div class="loading" id="loading">Loading model…</div>
<div class="err" id="err"></div>

<div class="tabs">
  <button class="tab active" data-file="AgriBot_complete.glb" data-label="Complete assembly">Complete</button>
  <button class="tab" data-file="AgriBot_chassis.glb" data-label="Chassis">Chassis</button>
  <button class="tab" data-file="AgriBot_sensor.glb" data-label="Sensor module">Sensor module</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  (function () {
    var missing = [];
    if (typeof THREE === 'undefined') missing.push('three.js');
    else {
      if (typeof THREE.GLTFLoader === 'undefined') missing.push('GLTFLoader');
      if (typeof THREE.OrbitControls === 'undefined') missing.push('OrbitControls');
    }
    if (missing.length) {
      var l = document.getElementById('loading');
      var e = document.getElementById('err');
      if (l) l.classList.add('hidden');
      if (e) {
        e.style.display = 'block';
        e.textContent = 'Could not load 3D viewer libraries (' + missing.join(', ') + '). Check your network connection and reload.';
      }
      throw new Error('Viewer dependencies missing: ' + missing.join(', '));
    }
  })();
</script>
<script>
  const wrap = document.getElementById('canvas-wrap');
  const loadingEl = document.getElementById('loading');
  const errEl = document.getElementById('err');
  const labelEl = document.getElementById('modelLabel');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14171a);

  const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.01, 1000);
  camera.position.set(2.2, 1.6, 2.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.1;
  controls.maxDistance = 50;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x2a2f33, 1.1);
  scene.add(hemi);
  const dir1 = new THREE.DirectionalLight(0xffffff, 1.0);
  dir1.position.set(5, 8, 5);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dir2.position.set(-5, -3, -5);
  scene.add(dir2);

  const grid = new THREE.GridHelper(10, 20, 0x33383c, 0x22262a);
  scene.add(grid);

  let currentModel = null;
  const loader = new THREE.GLTFLoader();

  function frameObject(object) {
    // Models are exported Z-up (CAD convention); three.js is Y-up.
    object.rotation.x = -Math.PI / 2;
    object.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(object);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    object.position.x -= center.x;
    object.position.y -= box.min.y;
    object.position.z -= center.z;

    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const distance = maxDim * 2.0;

    camera.position.set(distance * 0.75, distance * 0.55, distance * 0.9);
    controls.target.set(0, size.y / 2, 0);
    camera.near = maxDim / 100;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
    controls.update();

    grid.scale.setScalar(maxDim / 5);
  }

  function loadModel(filename, label) {
    loadingEl.classList.remove('hidden');
    loadingEl.textContent = 'Loading model…';
    errEl.style.display = 'none';
    labelEl.textContent = label;

    loader.load(
      filename,
      (gltf) => {
        if (currentModel) scene.remove(currentModel);
        currentModel = gltf.scene;
        currentModel.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.needsUpdate = true;
          }
        });
        scene.add(currentModel);
        frameObject(currentModel);
        loadingEl.classList.add('hidden');
      },
      undefined,
      (error) => {
        loadingEl.classList.add('hidden');
        errEl.style.display = 'block';
        errEl.textContent = 'Could not load ' + filename + '. Open this file directly from its folder (not a zipped copy) so the browser can find it alongside the viewer.';
        console.error(error);
      }
    );
  }

  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      loadModel(btn.dataset.file, btn.dataset.label);
    });
  });

  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  loadModel('AgriBot_complete.glb', 'Complete assembly');
</script>

</body>
</html>
